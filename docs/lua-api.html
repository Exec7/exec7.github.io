  <script>
    // Данные API



const clientapi = {
  "exechack_api.Notification": {
    "Description": "Displays an on-screen toast notification banner to the user.",
    "Arguments": { "string": "text - The message string to display on screen" },
    "Example": {
      "code": 'exechack_api.Notification("Welcome, " .. LocalPlayer():Nick())',
      "desc": "Displays a greeting notification with the local player's nickname.",
      "output": "Welcome, Player1"
    },
    "goodname": "Notification"
  },
  "exechack_api.SetCheatAngle": {
    "Description": "Overrides and forces the client's internal movement and aim direction angles.",
    "Arguments": { "Angle": "viewAngle - The target Euler angle to apply (Pitch, Yaw, Roll)" },
    "Example": {
      "code": "exechack_api.SetCheatAngle(Angle(0, 90, 0))",
      "desc": "Locks the player's view direction directly to the east.",
      "output": "View angle adjusted"
    },
    "goodname": "SetCheatAngle"
  },
  "exechack_api.GetCheatAngle": {
    "Description": "Retrieves the current manipulated view angle applied to the local player.",
    "Returns": { "Angle": "The active cheat angle vector (Pitch, Yaw, Roll)" },
    "Example": {
      "code": "local currentAngle = exechack_api.GetCheatAngle()\nprint(currentAngle)",
      "desc": "Queries and prints the client's active angle.",
      "output": "Angle(0.00, 90.00, 0.00)"
    },
    "goodname": "GetCheatAngle"
  },
  "exechack_api.CalcViewOverlayHook": {
    "Description": "A hook analogous to GM:CalcView that allows modifying third-person perspective, origin offset, and field of view with cheat synchronization.",
    "Arguments": {
      "ply": "Player entity",
      "pos": "Vector camera position",
      "angles": "Angle camera orientation",
      "fov": "Number field of view"
    },
    "Returns": { "Table": "view - Table containing origin, angles, fov, and drawviewer properties" },
    "Example": {
      "code": `exechack_api.CalcViewOverlayHook = function(ply, pos, angles, fov)
    local view = {
        origin = pos - (angles:Forward() * 120),
        angles = angles,
        fov = fov,
        drawviewer = true
    }
    return view
end`,
      "desc": "Positions the camera behind the player model in third-person view.",
      "output": "Renders camera 120 units behind the local player."
    },
    "goodname": "CalcViewOverlayHook"
  },
  "exechack_api.IsFriend": {
    "Description": "Checks whether a given player entity is marked in the local friend list.",
    "Arguments": { "Entity": "ply - The player entity to check" },
    "Returns": { "Boolean": "Returns true if the entity is registered as a friend, otherwise false" },
    "Example": {
      "code": `local trEntity = LocalPlayer():GetEyeTrace().Entity
if IsValid(trEntity) and trEntity:IsPlayer() then
    if exechack_api.IsFriend(trEntity) then
        print(trEntity:Nick() .. " is a friend.")
    else
        print(trEntity:Nick() .. " is not a friend.")
    end
end`,
      "desc": "Evaluates whether the entity under the player's crosshair is a friend.",
      "output": "TargetPlayer is a friend."
    },
    "goodname": "IsFriend"
  },
  "exechack_api.GetUserName": {
    "Description": "Returns the account username of the authenticated forum user.",
    "Returns": { "String": "The forum username associated with the active session" },
    "Example": {
      "code": 'print("Logged in as: " .. exechack_api.GetUserName())',
      "desc": "Prints the active user handle to the client console.",
      "output": "Logged in as: Exec"
    },
    "goodname": "GetUserName"
  },
  "exechack_api.CleanGlobalTable": {
    "Description": "Provides direct access to the clean, unmodified global table (_G) to call native functions bypassed by third-party hook detours or modifications.",
    "Example": {
      "code": `-- Override global print
print = function() end

-- Call the unhooked original print function
exechack_api.CleanGlobalTable.print("Clean output bypass")`,
      "desc": "Invokes the original standard library print function even if _G.print has been hooked or overwritten.",
      "output": "Clean output bypass"
    },
    "goodname": "CleanGlobalTable"
  },
  "exechack_api.cfg_SetValue": {
    "Description": "Sets a configuration value by key inside the client configuration environment.",
    "Arguments": {
      "string": "cfgName - Key identifier of the configuration variable",
      "string/boolean/float/table": "newValue - The value to store"
    },
    "Example": {
      "code": 'exechack_api.cfg_SetValue("AIM_ENABLED", false)',
      "desc": "Disables the aimbot setting within the client configuration.",
      "output": "AIM_ENABLED set to false"
    },
    "goodname": "cfg_SetValue"
  },
  "exechack_api.cfg_GetValue": {
    "Description": "Retrieves the current stored value for a given configuration variable.",
    "Arguments": { "string": "cfgName - Key identifier of the configuration variable" },
    "Returns": { "string/boolean/float/table": "The current value stored in the configuration" },
    "Example": {
      "code": 'local isEnabled = exechack_api.cfg_GetValue("AIM_ENABLED")\nprint("Aimbot status:", isEnabled)',
      "desc": "Fetches and prints the current state of AIM_ENABLED.",
      "output": "Aimbot status: false"
    },
    "goodname": "cfg_GetValue"
  }
};

const menustateapi = {
  "exec_background_render": {
    "Description": "Custom render function executed during menu state painting (analogous to derma.Paint). Designed for 800x499 resolution interfaces.<br><br>A ready-made prompt for creating your own background or mini-game for any AI, adjust the bottom part to suit your needs:<br><br>Create a Garry's Mod Lua script that generates an animation using basic primitives. The rendering will be handled by my global function exec_background_render, which corresponds to derma.Paint = function(self, w, h). The animation must be designed for an 800x499 resolution; do not use cam functions, and keep all logic within my render function (avoiding Think hooks). Use CurTime() instead of RealTime().<br><br>The animation centers on the tank on the left, which is designed to blow up drones when you click the left mouse button using the cursor.",
    "Arguments": {
      "panel": "derma panel reference",
      "float1": "w - Panel width in pixels",
      "float2": "h - Panel height in pixels"
    },
    "Example": {
      "code": `exec_background_render = function(self, w, h)
    surface.SetDrawColor(20, 20, 20, 255)
    surface.DrawRect(0, 0, w, h)

    surface.SetFont("Default")
    surface.SetTextColor(255, 255, 255)
    surface.SetTextPos(20, 20)
    surface.DrawText("Menu Canvas Ready")
end`,
      "desc": "Draws a dark background box with status text in the menu panel.",
      "output": "Paints background on the cheat menu panel."
    },
    "goodname": "background_render"
  },
  "exec_Fetch": {
    "Description": "Asynchronous HTTP GET request wrapper available within the menu state environment.",
    "Arguments": {
      "string": "url - The target HTTP/HTTPS URL",
      "function1": "onSuccess - Callback receiving (body, contentLength, headers, statusCode)",
      "function2": "onFailure - Callback receiving (errorMessage)"
    },
    "Example": {
      "code": `exec_Fetch("https://api.ipify.org?format=json", function(body)
    print("Response payload: " .. body)
end, function(err)
    print("Fetch error: " .. tostring(err))
end)`,
      "desc": "Fetches remote JSON data and prints the response body.",
      "output": "Response payload: {\"ip\":\"127.0.0.1\"}"
    },
    "goodname": "Fetch"
  },
  "exec_Post": {
    "Description": "Asynchronous HTTP POST request wrapper available within the menu state environment.",
    "Arguments": {
      "string1": "url - Target endpoint URL",
      "string2": "parameters - Encoded POST parameters or payload body",
      "function1": "onSuccess - Callback receiving response body",
      "function2": "onFailure - Callback receiving error message"
    },
    "Example": {
      "code": `exec_Post("https://httpbin.org/post", "user=Exec&action=sync", function(body)
    print("POST success: " .. body)
end, function(err)
    print("POST failed: " .. tostring(err))
end)`,
      "desc": "Dispatches form-encoded parameters via HTTP POST.",
      "output": "POST success: { ... }"
    },
    "goodname": "Post"
  },
  "exec_cfg_GetValue": {
    "Description": "Retrieves configuration parameter values from within the menu state.",
    "Arguments": { "string": "cfgName - Key name of the configuration variable" },
    "Returns": { "string/boolean/float/table": "The stored value" },
    "Example": {
      "code": 'local val = exec_cfg_GetValue("ESP_ENABLED")\nprint("ESP state: " .. tostring(val))',
      "desc": "Reads the boolean state of ESP_ENABLED.",
      "output": "ESP state: true"
    },
    "goodname": "cfg_GetValue"
  },
  "exec_cfg_SetValue": {
    "Description": "Updates a configuration parameter value from within the menu state.",
    "Arguments": {
      "string": "cfgName - Key identifier of the configuration variable",
      "string/boolean/float/table": "newValue - The value to store"
    },
    "Example": {
      "code": 'exec_cfg_SetValue("ESP_ENABLED", true)',
      "desc": "Enables the ESP_ENABLED configuration key.",
      "output": "ESP_ENABLED updated to true"
    },
    "goodname": "cfg_SetValue"
  },
  "exec_menuaddtab": {
    "Description": "Registers a new navigation tab inside the custom menu interface.",
    "Arguments": {
      "string": "tabName - Title of the tab",
      "function": "contentConstructor - Function defining the controls inside the tab"
    },
    "Example": {
      "code": `exec_menuaddtab("General Settings", function()
    exec_menuaddcheckbox("Auto Reload", 15, 30, "AUTO_RELOAD", "Automatically reloads weapon when empty")
end)`,
      "desc": "Creates a new tab titled 'General Settings' containing a checkbox.",
      "output": "Tab registered in the menu interface."
    },
    "goodname": "menuaddtab"
  },
  "exec_menuaddbutton": {
    "Description": "Adds an interactive push button to the active menu tab.",
    "Arguments": {
      "string": "buttonName - Button label text",
      "number1": "x - Horizontal offset position",
      "number2": "y - Vertical offset position",
      "function": "onClick - Callback triggered upon clicking"
    },
    "Example": {
      "code": `exec_menuaddtab("Actions", function()
    exec_menuaddbutton("Reset Defaults", 15, 40, function()
        exec_cfg_SetValue("AIM_ENABLED", false)
        print("Config reset to defaults.")
    end)
end)`,
      "desc": "Renders a button that resets configuration keys when clicked.",
      "output": "Config reset to defaults."
    },
    "goodname": "menuaddbutton"
  },
  "exec_menuaddbinder": {
    "Description": "Adds a key-binding selector widget to assign hotkeys to config variables.",
    "Arguments": {
      "string1": "label - Descriptive display name",
      "number1": "x - Horizontal position",
      "number2": "y - Vertical position",
      "string2": "cfgName - Key name in configuration to store the bound keycode"
    },
    "Example": {
      "code": `exec_menuaddtab("Binds", function()
    exec_menuaddbinder("Menu Toggle Key", 15, 30, "MENU_KEY")
end)`,
      "desc": "Places a key-bind selector mapped to the MENU_KEY variable.",
      "output": "Keybind component added."
    },
    "goodname": "menuaddbinder"
  },
  "exec_menuaddcheckbox": {
    "Description": "Adds a toggle checkbox widget bound to a boolean configuration value.",
    "Arguments": {
      "string1": "name - Checkbox label text",
      "number1": "x - Horizontal coordinate",
      "number2": "y - Vertical coordinate",
      "string2": "cfgName - Target configuration key",
      "string3": "description - Tooltip description text"
    },
    "Example": {
      "code": `exec_menuaddtab("Visuals", function()
    exec_menuaddcheckbox("Draw Crosshair", 15, 30, "DRAW_CROSSHAIR", "Displays a custom static crosshair")
end)`,
      "desc": "Adds a checkbox bound to the DRAW_CROSSHAIR configuration key.",
      "output": "Checkbox placed on tab."
    },
    "goodname": "menuaddcheckbox"
  },
  "exec_menuaddlabel": {
    "Description": "Renders static text onto the tab canvas.",
    "Arguments": {
      "string1": "text - Label content",
      "number1": "x - Horizontal position",
      "number2": "y - Vertical position",
      "number3": "fontSize - Font size between 10 and 25",
      "number4": "w - Width allocation",
      "number5": "h - Height allocation"
    },
    "Example": {
      "code": `exec_menuaddtab("About", function()
    exec_menuaddlabel("Script Version 1.0.0", 15, 20, 14, 200, 20)
end)`,
      "desc": "Adds an informational text label to the About tab.",
      "output": "Label rendered on tab."
    },
    "goodname": "menuaddlabel"
  },
  "exec_menuaddcolorpixer": {
    "Description": "Renders an RGBA color picker widget bound to a configuration variable.",
    "Arguments": {
      "string": "cfgName - Configuration key holding color values",
      "number1": "x - Horizontal position",
      "number2": "y - Vertical position"
    },
    "Example": {
      "code": `exec_menuaddtab("Colors", function()
    exec_menuaddcolorpixer("ACCENT_COLOR", 15, 30)
end)`,
      "desc": "Embeds a color selector that binds its output to ACCENT_COLOR.",
      "output": "Color picker mounted."
    },
    "goodname": "menuaddcolorpixer"
  },
  "exec_menuaddslider": {
    "Description": "Renders a numeric slider widget to control scalar configuration properties.",
    "Arguments": {
      "string1": "name - Slider title label",
      "number1": "x - Horizontal position",
      "number2": "y - Vertical position",
      "number3": "min - Minimum allowable numerical value",
      "number4": "max - Maximum allowable numerical value",
      "string2": "cfgName - Target configuration key"
    },
    "Example": {
      "code": `exec_menuaddtab("Aimbot", function()
    exec_menuaddslider("FOV Radius", 15, 30, 1, 180, "AIM_FOV")
end)`,
      "desc": "Creates a slider controlling AIM_FOV from 1 to 180.",
      "output": "Slider widget rendered."
    },
    "goodname": "menuaddslider"
  },
  "exec_menuaddtextentry": {
    "Description": "Adds an interactive single-line text input field.",
    "Arguments": {
      "number1": "x - Horizontal position",
      "number2": "y - Vertical position",
      "number3": "size - Field width in pixels",
      "function": "onChange - Callback receiving the updated string content"
    },
    "Example": {
      "code": `exec_menuaddtab("Config", function()
    exec_menuaddtextentry(15, 30, 250, function(text)
        print("Updated prefix: " .. text)
    end)
end)`,
      "desc": "Adds a text box that logs user input changes.",
      "output": "Updated prefix: [Admin]"
    },
    "goodname": "menuaddtextentry"
  },
  "exec_combobox": {
    "Description": "Adds a dropdown selection combo box to the menu.",
    "Arguments": {
      "number1": "x - Horizontal position",
      "number2": "y - Vertical position",
      "string1": "cfgName - Key name to save selected option",
      "table": "options - Array of string choices",
      "string2": "name - Dropdown label title"
    },
    "Example": {
      "code": `exec_menuaddtab("Combat", function()
    exec_combobox(15, 30, "TARGET_HITBOX", {"Head", "Chest", "Pelvis"}, "Target Bone")
end)`,
      "desc": "Creates a combo box dropdown allowing selection between target bones.",
      "output": "Hitbox selector added."
    },
    "goodname": "combobox"
  },
  "exec_CreateDir": {
    "Description": "Creates a directory path relative to the script storage root.",
    "Arguments": { "string": "directory - Relative path of the folder to create" },
    "Example": {
      "code": 'exec_CreateDir("custom_configs/profiles")',
      "desc": "Creates a nested folder structure for saving profiles.",
      "output": "Directory created."
    },
    "goodname": "CreateDir"
  },
  "exec_Delete": {
    "Description": "Deletes a designated file or empty folder within the allowed storage boundary.",
    "Arguments": { "string": "filenameOrDir - Path to target file or directory" },
    "Example": {
      "code": `if exec_Exists("temp_cache.txt") then
    exec_Delete("temp_cache.txt")
    print("Old cache deleted.")
end`,
      "desc": "Checks for and removes an obsolete cache file.",
      "output": "Old cache deleted."
    },
    "goodname": "Delete"
  },
  "exec_Exists": {
    "Description": "Verifies whether a file or directory exists at the relative path.",
    "Arguments": { "string": "filenameOrDir - Path to test" },
    "Returns": { "boolean": "True if path exists, false otherwise" },
    "Example": {
      "code": 'local exists = exec_Exists("settings.json")\nprint("Config exists: " .. tostring(exists))',
      "desc": "Queries if settings.json is present in the filesystem.",
      "output": "Config exists: true"
    },
    "goodname": "Exists"
  },
  "exec_IsDir": {
    "Description": "Determines whether a given path refers to an existing directory.",
    "Arguments": { "string": "dir - Path to inspect" },
    "Returns": { "boolean": "True if directory, false if file or nonexistent" },
    "Example": {
      "code": 'local isFolder = exec_IsDir("configs")\nprint("Is directory: " .. tostring(isFolder))',
      "desc": "Checks if the path is a valid folder.",
      "output": "Is directory: true"
    },
    "goodname": "IsDir"
  },
  "exec_List": {
    "Description": "Returns lists of files and subdirectories located within a specific directory.",
    "Arguments": { "string": "directory - Target folder path" },
    "Returns": {
      "table1": "files - Array of filenames found",
      "table2": "directories - Array of subdirectories found"
    },
    "Example": {
      "code": `local files, dirs = exec_List("configs")
for _, file in ipairs(files) do
    print("Found config file: " .. file)
end`,
      "desc": "Enumerates all files in the configs directory.",
      "output": "Found config file: default.cfgexec"
    },
    "goodname": "List"
  },
  "exec_Read": {
    "Description": "Reads and returns the contents of a local file as a string.",
    "Arguments": { "string": "path - File path to read" },
    "Returns": { "string": "Raw content of the file" },
    "Example": {
      "code": 'local content = exec_Read("configs/default.txt")\nprint(content)',
      "desc": "Loads text from a stored configuration file.",
      "output": "AIM_ENABLED=true"
    },
    "goodname": "Read"
  },
  "exec_Write": {
    "Description": "Writes raw text content to a specified file path, overwriting or creating it if missing.",
    "Arguments": {
      "string1": "path - Destination file path",
      "string2": "content - Text content to write"
    },
    "Example": {
      "code": 'exec_Write("configs/backup.txt", "AIM_ENABLED=false\\nESP_ENABLED=true")',
      "desc": "Writes backup configuration parameters to disk.",
      "output": "File written successfully."
    },
    "goodname": "Write"
  },
  "exec_notification": {
    "Description": "Displays a popup notification banner within the menu state interface.",
    "Arguments": { "string": "text - Message string to display" },
    "Example": {
      "code": 'exec_notification("Profile loaded successfully.")',
      "desc": "Shows a confirmation banner in the menu GUI.",
      "output": "Notification displayed on menu."
    },
    "goodname": "notification"
  },
  "exec_runtoclientside": {
    "Description": "Transfers and evaluates a string of Lua code directly inside the client game state from the menu state.",
    "Arguments": { "string": "code - Raw Lua script string to run" },
    "Example": {
      "code": `exec_runtoclientside([[
    chat.AddText(Color(0, 255, 0), "[System] Script loaded on client.")
]])`,
      "desc": "Executes a chat print call inside the active game client.",
      "output": "[System] Script loaded on client."
    },
    "goodname": "runtoclientside"
  },
  "exec_addclientcodetoautorun": {
    "Description": "Registers Lua code to automatically execute on the client each time the user joins a server.",
    "Arguments": {
      "string1": "name - Unique identifier for the autorun entry",
      "string2": "code - Lua code to execute on join"
    },
    "Example": {
      "code": `exec_addclientcodetoautorun("InitMessage", [[
    hook.Add("InitPostEntity", "WelcomeNotice", function()
        print("Joined server successfully.")
    end)
]])`,
      "desc": "Attaches an autorun script that prints to the console upon joining.",
      "output": "Joined server successfully."
    },
    "goodname": "addclientcodetoautorun"
  },
  "exec_newclientrunned": {
    "Description": "Callback invoked whenever a fresh client-side environment is initialized.",
    "Example": {
      "code": `local oldRunned = exec_newclientrunned
exec_newclientrunned = function()
    exec_runtoclientside([[print("New client instance initialized.")]])
    if oldRunned then return oldRunned() end
end`,
      "desc": "Hooks the client initialization lifecycle to execute bootstrap code.",
      "output": "New client instance initialized."
    },
    "goodname": "newclientrunned"
  },
  "luaruncontrol": {
    "Description": "Intercept hook triggered when Garry's Mod loads a Lua file, allowing runtime modification or substitution of incoming scripts.",
    "Arguments": {
      "string1": "fileDirectory - Path of the Lua file being loaded",
      "string2": "code - Raw content of the file"
    },
    "Returns": { "string": "Replacement Lua code to be executed instead" },
    "Example": {
      "code": `hook.Add("luaruncontrol", "FilterScript", function(filePath, sourceCode)
    if string.find(filePath, "screengrab.lua") then
        return "print('Blocked screengrab execution')"
    end
end)`,
      "desc": "Intercepts loading of screengrab.lua and substitutes it with a stub message.",
      "output": "Blocked screengrab execution"
    },
    "goodname": "lua run control"
  },
  "cfg nameing": {
    "Description": "Reference and listing of all configuration keys and types available across the configuration system.",
    "Example": {
      "code": `local currentAimbot = exec_cfg_GetValue("AIM_ENABLED")
exec_cfg_SetValue("AIM_ENABLED", not currentAimbot)
print("AIM_ENABLED toggled to: " .. tostring(exec_cfg_GetValue("AIM_ENABLED")))`,
      "desc": "Example of reading and toggling a standard boolean configuration key.",
      "output": "AIM_ENABLED toggled to: true"
    },
    "goodname": "cfg naming"
  }
};

    // Отрисовка бокового меню
    function renderSidebar() {
      const clientList = document.getElementById("clientside-list");
      const menuList = document.getElementById("menustate-list");

      clientList.innerHTML = Object.keys(clientapi).map(key => `
        <li>
          <a href="#${key}" onclick="renderFunction('${key}'); return false;" class="navigation_link nav-item block py-1 px-2 rounded hover:bg-brand-surface hover:text-white transition-all text-brand-subtext" data-func="${key}">
            ${clientapi[key].goodname}
          </a>
        </li>
      `).join('');

      menuList.innerHTML = Object.keys(menustateapi).map(key => `
        <li>
          <a href="#${key}" onclick="renderFunction('${key}'); return false;" class="navigation_link nav-item block py-1 px-2 rounded hover:bg-brand-surface hover:text-white transition-all text-brand-subtext" data-func="${key}">
            ${menustateapi[key].goodname}
          </a>
        </li>
      `).join('');
    }

    // Подсветка активного пункта в меню
    function updateActiveLink(funcName) {
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.getAttribute('data-func') === funcName) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    // Отрисовка главной страницы
    function renderMainPage() {
      updateActiveLink(null);
      window.location.hash = '';

      const contentArea = document.getElementById("content-area");
      contentArea.innerHTML = `
        <h1 class="text-xl sm:text-2xl font-bold text-white mb-4 flex items-center gap-2">
          <i data-lucide="sparkles" class="text-brand-highlight w-6 h-6"></i>
          Welcome to the exechack.cc lua api!
        </h1>
        <div class="text-xs sm:text-sm text-brand-subtext space-y-4 leading-relaxed">
          <p>
            Lets start with the main thing, exechackapi is an addition to the standard API for developing addons(GLUA).<br>
            <a href="https://wiki.facepunch.com/gmod" target="_blank" class="text-amber-400 hover:underline">https://wiki.facepunch.com/gmod</a>
          </p>
          <p>
            there are 2 types of scripts, 1 popular - <a href="https://wiki.facepunch.com/gmod/States#client" target="_blank" class="text-amber-400 hover:underline">client</a>, and <a href="https://wiki.facepunch.com/gmod/States#menu" target="_blank" class="text-amber-400 hover:underline">menustate</a>.
          </p>
          <p>
            To run clientside name <code class="bg-brand-bg px-2 py-0.5 rounded border border-gray-700 text-brand-highlight">*.lua</code>, for menustate name <code class="bg-brand-bg px-2 py-0.5 rounded border border-gray-700 text-brand-highlight">*.luamenu</code>.<br>
            To autorun lua, add <code class="bg-brand-bg px-2 py-0.5 rounded border border-gray-700 text-brand-highlight">*广_autorun.lua</code> to the name.
          </p>
          <p>
            dangerous functions are available in <a href="https://wiki.facepunch.com/gmod/States#menu" target="_blank" class="text-amber-400 hover:underline">menustate</a> that can change files on your computer, so launching in <a href="https://wiki.facepunch.com/gmod/States#menu" target="_blank" class="text-amber-400 hover:underline">menustate</a> is only possible with a cheat or changing game files, which the server cannot do.
          </p>
          <p>
            <a href="https://wiki.facepunch.com/gmod/States#client" target="_blank" class="text-amber-400 hover:underline">client</a> scripts work in the same environment with addons and this environment is limited so that the creators cannot harm you.<br>
            but in the environment <a href="https://wiki.facepunch.com/gmod/States#menu" target="_blank" class="text-amber-400 hover:underline">menustate</a> you can interact with the cheat menu and run scripts on the <a href="https://wiki.facepunch.com/gmod/States#client" target="_blank" class="text-amber-400 hover:underline">client</a> environment through the function <code class="bg-brand-bg px-2 py-0.5 rounded border border-gray-700 text-brand-highlight">runtoclientside</code>.
          </p>
          <p>
            An example of the simplest script with the interaction of the menu and cfg cheat with launch on the <a href="https://wiki.facepunch.com/gmod/States#client" target="_blank" class="text-amber-400 hover:underline">client</a>:
          </p>

          <div class="relative bg-brand-bg p-4 rounded-lg border border-gray-700/60 font-mono text-xs overflow-x-auto text-brand-text">
            <button onclick="copyToClipboard(this)" class="absolute top-2 right-2 p-1.5 rounded bg-brand-card hover:bg-brand-surface text-brand-subtext hover:text-white transition-all" title="Copy code">
              <i data-lucide="copy" class="w-4 h-4"></i>
            </button>
            <pre><code>if IsInGame()then Derma_Message("run only in main menu","1","OK")return end
if exec_cfg_GetValue("PRINTONSPAWN")==nil then
	exec_cfg_SetValue("PRINTONSPAWN",false)
end
exec_addclientcodetoautorun("printserver",[[
if exechack_api.cfg_GetValue("PRINTONSPAWN")then
	print(1)
end
]])
exec_menuaddtab("my tab",function()
	exec_menuaddcheckbox("print 1 on spawnserver",15,30,"PRINTONSPAWN","description")
end)</code></pre>
          </div>

          <div class="mt-4">
            <img src="https://i.imgur.com/UnTTX1Z.png" class="rounded border border-gray-700 max-w-full" alt="Example">
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
      document.body.classList.remove("navigation_opened");
    }

    // Отрисовка страницы конкретной функции
    function renderFunction(funcName) {
      const fu = clientapi[funcName] || menustateapi[funcName];
      if (!fu) return;

      updateActiveLink(funcName);
      window.location.hash = funcName;

      const contentArea = document.getElementById("content-area");

      let html = `
        <h1 class="text-xl sm:text-2xl font-bold text-white mb-2 flex items-center gap-2">
          <i data-lucide="code" class="text-brand-highlight w-6 h-6"></i>
          ${funcName}
        </h1>
        <p class="text-xs sm:text-sm text-brand-subtext mb-6">${fu.Description}</p>
      `;

      // Arguments
      if (fu.Arguments) {
        html += `
          <div class="mb-6">
            <h2 class="text-base font-semibold text-white mb-2 flex items-center gap-1.5">
              <i data-lucide="list-tree" class="w-4 h-4 text-brand-accent"></i> Arguments
            </h2>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs sm:text-sm text-brand-text border-collapse">
                <thead>
                  <tr class="bg-brand-surface/60 border-b border-gray-700/50">
                    <th class="p-2 sm:p-2.5 font-semibold">Type</th>
                    <th class="p-2 sm:p-2.5 font-semibold">Description</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-700/30">
        `;
        for (const [type, desc] of Object.entries(fu.Arguments)) {
          html += `
            <tr>
              <td class="p-2 sm:p-2.5 font-mono text-brand-highlight">${type}</td>
              <td class="p-2 sm:p-2.5 text-brand-subtext">${desc}</td>
            </tr>
          `;
        }
        html += `
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // Returns
      if (fu.Returns) {
        html += `
          <div class="mb-6">
            <h2 class="text-base font-semibold text-white mb-2 flex items-center gap-1.5">
              <i data-lucide="corner-down-right" class="w-4 h-4 text-brand-accent"></i> Returns
            </h2>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs sm:text-sm text-brand-text border-collapse">
                <thead>
                  <tr class="bg-brand-surface/60 border-b border-gray-700/50">
                    <th class="p-2 sm:p-2.5 font-semibold">Type</th>
                    <th class="p-2 sm:p-2.5 font-semibold">Description</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-700/30">
        `;
        for (const [type, desc] of Object.entries(fu.Returns)) {
          html += `
            <tr>
              <td class="p-2 sm:p-2.5 font-mono text-brand-highlight">${type}</td>
              <td class="p-2 sm:p-2.5 text-brand-subtext">${desc}</td>
            </tr>
          `;
        }
        html += `
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      // Example
      if (fu.Example) {
        const tb = fu.Example;
        html += `
          <div class="mb-6">
            <h2 class="text-base font-semibold text-white mb-2 flex items-center gap-1.5">
              <i data-lucide="terminal" class="w-4 h-4 text-brand-accent"></i> Example
            </h2>
            <p class="text-xs sm:text-sm text-brand-subtext mb-2">${tb.desc}</p>

            <div class="relative bg-brand-bg p-4 rounded-lg border border-gray-700/60 font-mono text-xs overflow-x-auto text-brand-text">
              <button onclick="copyToClipboard(this)" class="absolute top-2 right-2 p-1.5 rounded bg-brand-card hover:bg-brand-surface text-brand-subtext hover:text-white transition-all" title="Copy code">
                <i data-lucide="copy" class="w-4 h-4"></i>
              </button>
              <pre><code>${escapeHtml(tb.code)}</code></pre>
            </div>
        `;
        if (tb.output) {
          html += `
            <div class="mt-3 text-xs sm:text-sm text-brand-subtext">
              <span class="font-semibold text-white">Output:</span> ${tb.output}
            </div>
          `;
        }
        html += `</div>`;
      }

      contentArea.innerHTML = html;
      if (window.lucide) lucide.createIcons();
      document.body.classList.remove("navigation_opened");
    }

    // Вспомогательные функции
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function copyToClipboard(button) {
      const code = button.nextElementSibling.innerText;
      navigator.clipboard.writeText(code).then(() => {
        const icon = button.querySelector('i');
        button.classList.add('text-emerald-400');
        setTimeout(() => {
          button.classList.remove('text-emerald-400');
        }, 1500);
      });
    }

    // Инициализация при загрузке
    document.addEventListener("DOMContentLoaded", () => {
      renderSidebar();

      // Мобильная кнопка навигации API
      const btn = document.querySelector(".navigation-button");
      const backdrop = document.querySelector(".navigation_backdrop");

      if (btn) {
        btn.addEventListener("click", () => {
          document.body.classList.toggle("navigation_opened");
        });
      }

      if (backdrop) {
        backdrop.addEventListener("click", () => {
          document.body.classList.remove("navigation_opened");
        });
      }

      // Роутинг по хешу в URL
      const hash = decodeURIComponent(window.location.hash.replace('#', ''));
      if (hash && (clientapi[hash] || menustateapi[hash])) {
        renderFunction(hash);
      } else {
        renderMainPage();
      }

      if (window.lucide) {
        lucide.createIcons();
      }
    });

    // Обработка перехода по кнопкам назад/вперед в браузере
    window.addEventListener("hashchange", () => {
      const hash = decodeURIComponent(window.location.hash.replace('#', ''));
      if (hash && (clientapi[hash] || menustateapi[hash])) {
        renderFunction(hash);
      } else {
        renderMainPage();
      }
    });
  </script>
</body>

</html>
